
[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
listen = 0.0.0.0:9000


user = www-data
group = www-data

listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 100

clear_env = no