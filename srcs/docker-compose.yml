services:
  mariadb:
    container_name: mariadb
    image: mariadb
    pull_policy: never
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    restart: on-failure
    env_file:
      - .env
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception

  wordpress:
    container_name: wordpress
    image: wordpress
    pull_policy: never
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    depends_on:
      - mariadb
    restart: on-failure
    env_file:
      - .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

  nginx:
    container_name: nginx
    image: nginx
    pull_policy: never
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    depends_on:
      - wordpress
    ports:
      - "443:443"
    restart: on-failure
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/liliu/data/mariadb
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/liliu/data/wordpress

networks:
  inception:
    driver: bridge
